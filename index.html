<style>
  /* ===== COLORS: yahan se badlo ===== */
  :root {
    --bg: #ffcf6e;          /* base background (overscroll ke liye) */
    --bg-glow: #fff3cc;     /* logo ke peeche halki chamak */
    --bg-top: #ffe8ab;      /* gradient upar */
    --bg-mid: #ffcf6e;      /* gradient beech */
    --bg-bottom: #f6a27c;   /* gradient niche */
    --heading: #000000;     /* heading color */
    --text: #111111;        /* tagline color */
    --btn-top: #ff7a00;     /* button gradient upar */
    --btn-bottom: #98092a;  /* button gradient niche */
    --btn-text: #ffffff;
    --card-bg: #ffffff;     /* box background */
    --card-border: #f6d4e0; /* box ka halka border */
    --card-title: #1f2347;  /* box title color */
    --card-desc: #6b5a5f;   /* box description color */
    --icon: #a50c2b;        /* box icon color */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--bg-bottom); }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 160px, var(--bg-glow) 0%, rgba(255,243,204,0) 60%),
      linear-gradient(170deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
    background-repeat: no-repeat;
    text-align: center;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 12px 40px;
  }

  /* 1. TOP IMAGE (gol logo) */
  .logo {
    display: block;
    width: 140px;
    height: 140px;
    margin: 0 auto;
    border-radius: 50%;
    object-fit: contain;
    border: 4px solid #fff;
    box-shadow: 0 0 0 7px rgba(255,255,255,.45), 0 16px 34px rgba(120,10,40,.35);
  }

  /* 2. HEADING */
  .title {
    font-family: "Times New Roman", Times, serif;
    font-weight: 700;
    font-size: 37px;
    line-height: 1.2;
    color: var(--heading);
    margin-top: 8px;
  }

  /* 3. CONTENT */
  .tagline {
    font-family: "Roboto", Arial, sans-serif;
    font-weight: 300;
    font-size: 20px;
    line-height: 1.4;
    color: var(--text);
    margin-top: 18px;
  }

  /* 4. DOWNLOAD BUTTON */
  .btn {
    display: block;
    width: 60%;
    max-width: 420px;
    margin: 14px auto 0;
    padding: 6px 10px;
    border-radius: 30px;
    background: linear-gradient(to bottom, var(--btn-top), var(--btn-bottom));
    color: var(--btn-text);
    font-family: "Times New Roman", Times, serif;
    font-size: 20px;
    line-height: 1.5;
    text-decoration: none;
    box-shadow: 0 10px 22px rgba(152,9,42,.35);
    /* NEW: button upar-niche hilta rahe */
    animation: floatUpDown 1.5s ease-in-out infinite;
  }
  .btn:focus-visible { outline: 3px solid #000; outline-offset: 3px; }

  /* NEW: upar-niche hilne wali animation */
  @keyframes floatUpDown {
    0%, 100% {
      transform: translateY(0);
      box-shadow: 0 10px 22px rgba(152,9,42,.35);
    }
    50% {
      transform: translateY(-10px);
      box-shadow: 0 20px 28px rgba(152,9,42,.25);
    }
  }

  /* NEW: hover par button thoda bada ho jaye (animation chalti rahegi) */
  .btn:hover {
    scale: 1.05;
  }

  /* 5. CHAAR BOXES */
  .cards {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;                  /* CHANGED: pehle 14px */
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;        /* CHANGED: pehle 24px */
    box-shadow: 0 10px 26px rgba(150,40,40,.16);
    padding: 10px 18px 10px;    /* CHANGED: pehle 16px 24px 16px */
    text-align: left;
    font-family: "Lexend", Arial, sans-serif;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;                  /* CHANGED: pehle 14px */
    margin-bottom: 6px;         /* CHANGED: pehle 12px */
  }
  .card-head .ic {
    width: 22px;                /* CHANGED: pehle 26px */
    height: 22px;               /* CHANGED: pehle 26px */
    flex: none;
    display: grid;
    place-items: center;
    color: var(--icon);
    fill: var(--icon);
    font-weight: 700;
    font-size: 22px;            /* CHANGED: pehle 26px */
    line-height: 1;
  }
  .card-head .ic svg { width: 20px; height: 20px; fill: var(--icon); }  /* CHANGED: pehle 24px */
  .card h3 {
    font-weight: 500;
    font-size: 17px;            /* CHANGED: pehle 21px */
    line-height: 1.3;
    color: var(--card-title);
  }
  .card p {
    font-weight: 400;
    font-size: 12px;            /* CHANGED: pehle 13px */
    line-height: 1.4;           /* CHANGED: pehle 1.5 */
    color: var(--card-desc);
  }
</style>
</head>

  <!-- ===== BUTTON CLICK = META PIXEL "Subscribe" EVENT ===== -->
  <script>
    document.getElementById('downloadBtn').addEventListener('click', function (e) {
      var url = this.getAttribute('href');

      // Subscribe event fire karo
      if (typeof fbq === 'function') {
        fbq('track', 'Subscribe');
      }

      // Event bhejne ka thoda time dekar link kholo
      if (url && url !== '#') {
        e.preventDefault();
        setTimeout(function () { window.location.href = url; }, 300);
      } else {
        e.preventDefault();
      }
    });
  </script>
